services:
  app:
    build: .
    image: airline-env:0.3
    volumes:
      - ./data:/app/data

  db: 
    image: postgres:16
    environment: 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: 
      - pgdata:/var/lib/postgresql/data
    healthcheck: 
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s 
      timeout: 5s
      retries: 5

volumes: 
  pgdata: